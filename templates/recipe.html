<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='styles.css') }}">

    <title>{{ name }}</title>
</head>

<body>

    <h1>{{ name }}</h1>

    <div style="display: flex; justify-content: flex-start; flex-direction: column;">

        <img src="{{ url_for('static', filename='images/' + name + '.jpg') }}"
             alt="{{ name }}"
             width="300">

        <h2 style="margin-bottom: 0%;">Description</h2>
        <p>{{description}}</p>

        <h2 style="margin-bottom: 0;">Ingredients</h2>
        <ul>
            {% for ingredient in ingredients%}
            <li>{{ ingredient }}</li>
            {%endfor%}
        </ul>

        <h2 style="margin-bottom: 0;">Steps</h2>
        <ol>

            {% for step in steps%}
            <li>{{ step }}</li>
            {%endfor%}
        </ol>

        <a href="{{ url_for('home') }}">
            Home
        </a>

    </div>

</body>
</html>
